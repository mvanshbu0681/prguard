[project]
name = "prguard"
version = "0.1.0"
description = "Evidence-based merge gate — an AI PR reviewer that proves its claims."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite",
    "alembic",
    "anthropic",
    "asyncpg",
    "fastapi",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "tenacity",
    "unidiff",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prguard"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["prguard"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
disallow_untyped_defs = true
warn_return_any = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not requires_docker and not requires_network'"
markers = [
    "requires_docker: needs a running Docker daemon; deselected by default",
    "requires_network: needs outbound network access; deselected by default",
]
