# Alembic configuration — migrations live inside the package so they ship with the wheel.
[alembic]
script_location = src/prguard/migrations
prepend_sys_path = src
version_path_separator = os
path_separator = os
file_template = %%(rev)s_%%(slug)s
# Overridden at runtime from Settings.DATABASE_URL (prguard.db.session.alembic_config).
sqlalchemy.url = sqlite+aiosqlite:///./prguard.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
