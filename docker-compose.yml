name: prguard

services:
  api:
    build:
      context: .
      args:
        APP: api
    env_file: .env
    environment:
      DATA_DIR: /data
      GITHUB_PRIVATE_KEY_PATH: /app/github-app.pem
      NODE_ENV: ${API_NODE_ENV:-production}
      DEV_LOGIN: ${DEV_LOGIN:-}
    volumes:
      - prguard-data:/data
      - ./github-app.pem:/app/github-app.pem:ro
    ports:
      - "8000:8000"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      args:
        APP: dashboard
    environment:
      API_URL: http://api:8000
    ports:
      - "3001:3001"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  prguard-data:
